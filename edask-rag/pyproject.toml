[project]
name = "edask"
version = "0.1.0"
description = "ED(A)SK — a minimal, modern RAG system demonstrating embeddings, vector stores, and similarity search."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "chethan" }]
license = { text = "MIT" }

dependencies = [
    # vector + embeddings
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    # llms
    "anthropic>=0.40",
    "openai>=1.50",
    # api / ui
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    # config + utils
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.9",
    "typer>=0.13",
    # text processing
    "tiktoken>=0.8",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edask"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format handles line length

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
