name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3

      - name: set up python
        run: uv python install 3.12

      - name: install deps
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
